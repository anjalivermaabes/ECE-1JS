<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Employee Manager Dashboard</h1>

        <!-- Employee Form -->
        <div class="form-box">
            <h2>Add New Employee</h2>

            <label>Name:</label>
            <input type="text" id="name" placeholder="Enter Name">

            <label>Employee ID:</label>
            <input type="text" id="empId" placeholder="Enter ID">

            <label>Salary:</label>
            <input type="number" id="salary" placeholder="Enter Salary">

            <label>Department:</label>
            <input type="text" id="department" placeholder="Enter Department">

            <button onclick="addEmployee()">Add Employee</button>
            <button onclick="clearForm()">Clear Form</button>
        </div>

        <!-- Action Buttons -->
        <div class="button-box">
            <h2>Operations</h2>
            <button onclick="displayEmployees()">Show All Employees</button>
            <button onclick="filterSalary()">High Salary (₹50,000+)</button>
            <button onclick="totalSalary()">Calculate Total Salary</button>
            <button onclick="averageSalary()">Calculate Average Salary</button>
            <button onclick="countDepartment()">Department Count</button>
        </div>

        <!-- Department Search -->
        <div class="department-box">
            <h2>Search Department</h2>
            <input type="text" id="deptSearch" placeholder="Enter Department Name">
        </div>

        <!-- Output -->
        <div id="output" class="output-box">
            <h2>Output</h2>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
